# Builds the image and runs the in-container checks. Heavy (Julia precompile), so it runs on demand, weekly, and when
# the environment definition changes — not on every PR. Records size and build time as job outputs for the benchmark.
name: image
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  push:
    branches: [main]
    paths: ["Dockerfile", "env/**", "docker/**", "compose.yaml", ".github/workflows/image.yml"]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build (cached)
        run: |
          start=$(date +%s)
          DOCKER_BUILDKIT=1 docker build --build-arg WITH_JULIA=1 -t tinkuy-qhali:local .
          echo "build_seconds=$(( $(date +%s) - start ))" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "image_size_bytes=$(docker image inspect tinkuy-qhali:local --format '{{.Size}}')" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Lockfiles match the image (drift check)
        run: docker run --rm -v "$PWD/tools:/tools:ro" tinkuy-qhali:local python /tools/check_renv_drift.py
      - name: In-container smoke tests
        run: |
          set -e
          docker run --rm tinkuy-qhali:local Rscript -e 'library(arrow); library(duckdb); library(sf); library(targets)'
          docker run --rm tinkuy-qhali:local python -c "import duckdb, pyarrow, polars"
          docker run --rm tinkuy-qhali:local julia --version
          docker run --rm tinkuy-qhali:local Rscript -e 'JuliaCall::julia_setup(installJulia = FALSE); stopifnot(JuliaCall::julia_eval("1+1") == 2)'
          docker run --rm tinkuy-qhali:local dvc --version
          docker run --rm tinkuy-qhali:local quarto --version
