# Renders the Quarto site and deploys it to GitHub Pages (source: GitHub Actions). Why not pkgdown/Netlify: ADR 0006/0.6 —
# the repo is not a pure R package and we do not need a custom domain yet; revisit when either changes.
name: site
on:
  push:
    branches: [main]
    paths: ["_quarto.yml", "index.qmd", "MANIFESTO.md", "docs/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: "1.10.19"
      - name: Render
        run: quarto render
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
