[project]
name = "tinkuy-qhali-py"
version = "0.0.1"
description = "Python side of the tinkuy-qhali pipeline (validators, DuckDB/Arrow stages, ML). Parquet is the contract with R and Julia."
requires-python = ">=3.13"
license = "MIT"
dependencies = [
  "duckdb>=1.3",
  "pyarrow>=19",
  "polars>=1.20",
  "pyyaml>=6",
  "jsonschema>=4.23",
  "requests>=2.32",
  "frictionless>=5.18",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.uv]
package = false
